<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梦角字卡传讯</title>
<style>
*{
  box-sizing: border-box;
  margin:0;
  padding:0;
}
:root{
  --color-main: #7c68ee;
  --color-bg: #ffffff;
  --color-text: #222222;
  --color-text-2: #666666;
  --color-border: #e5e7eb;
  --radius-global: 18px;
  --radius-card: 14px;
  --radius-btn: 10px;
  --tab-inactive: #999999;
  --tab-active: var(--color-main);
}
body{
  background-color: #eee;
  font-family: system-ui, sans-serif;
}
.phone-shell{
  width: 375px;
  height: 700px;
  margin: 20px auto;
  background: var(--color-bg);
  border-radius: 40px;
  border:8px solid #222;
  overflow: hidden;
  display:flex;
  flex-direction:column;
}
.view-area{
  flex:1;
  overflow:hidden;
  position:relative;
}
.tab-panel{
  width:100%;
  height:100%;
  display:none;
  overflow:auto;
}
.tab-footer{
  display:flex;
  border-top:1px solid var(--color-border);
}
.tab-btn{
  flex:1;
  padding:12px 0;
  border:none;
  font-size:14px;
  background:var(--color-bg);
  color:var(--color-text);
}
</style>
</head>
<body>
<div class="phone-shell">
  <div class="view-area">
    <!-- 四个面板，就是JS要找的“门” -->
    <div id="tab-desktop" class="tab-panel"></div>
    <div id="tab-card" class="tab-panel"></div>
    <div id="tab-chat" class="tab-panel"></div>
    <div id="tab-setting" class="tab-panel"></div>
  </div>
  <!-- 底部Tab按钮 -->
  <div class="tab-footer">
    <button class="tab-btn" data-tab="desktop">桌面</button>
    <button class="tab-btn" data-tab="card">字卡</button>
    <button class="tab-btn" data-tab="chat">聊天</button>
    <button class="tab-btn" data-tab="setting">设置</button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
