<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>梦角MJ</title>
  <style>
    :root {
      --main-color: #8c78b9;
      --global-radius: 16px;
      --bubble-radius: 12px;
      --toast-bg: #333333;
      --toast-text: #ffffff;
      --chat-bg: #121212;
      --me-bubble: #504080;
      --mj-bubble: #2c2c2c;
      --panel-bg: #1b1b1b;
      --desk-bg: #f2f0f5;
      --card-bg: #ffffff;
      --text-main: #222222;
      --text-sub: #888888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: system-ui, sans-serif;
      color: var(--text-main);
    }
    .phone-shell {
      width: 360px;
      height: 720px;
      border-radius: 42px;
      border: 10px solid #111;
      background: #000;
      overflow: hidden;
      position: relative;
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      height: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
      font-size: 12px;
      flex-shrink: 0;
    }
    .app-main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .page {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      display: none;
      flex-direction: column;
    }
    .page.active { display: flex; }

    /* ===== 桌面页 ===== */
    #page-desktop { background: var(--desk-bg); padding: 12px; }
    .desk-top { display: flex; gap: 10px; margin-bottom: 12px; }
    .desk-card {
      flex: 1;
      background: var(--card-bg);
      border-radius: var(--global-radius);
      padding: 14px;
    }
    .desk-card .label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
    .desk-card .value { font-size: 15px; font-weight: 600; }
    .checkin-bar {
      background: var(--card-bg);
      border-radius: var(--global-radius);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .checkin-ico {
      width: 34px; height: 34px; border-radius: 50%;
      background: #111; color: #fff;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .checkin-text { flex: 1; font-size: 13px; }
    .checkin-btn {
      background: #111; color: #fff; border: none;
      border-radius: 999px; padding: 8px 16px; font-size: 13px; cursor: pointer;
    }
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px 10px;
    }
    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      position: relative;
    }
    .icon-box {
      width: 52px; height: 52px;
      border-radius: 16px;
      background: var(--card-bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .icon-name { font-size: 12px; color: var(--text-main); }
    .badge {
      position: absolute;
      top: -4px; right: 6px;
      min-width: 18px; height: 18px;
      border-radius: 999px;
      background: #e53935; color: #fff;
      font-size: 11px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 5px;
    }
    .desk-dots {
      display: flex; justify-content: center; gap: 6px;
      margin-top: 18px;
    }
    .desk-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: #bbb;
    }
    .desk-dots span.on { background: #333; }

    /* ===== 功能页通用顶栏 ===== */
    .func-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid #282828;
      flex-shrink: 0;
    }
    .back-btn {
      background: none; border: none; color: inherit;
      font-size: 18px; cursor: pointer; padding: 4px 8px;
    }
    .func-title { font-weight: 600; font-size: 15px; }
    .func-body { flex: 1; overflow-y: auto; padding: 12px; }

    /* ===== 聊天页 ===== */
    #page-chat { background: var(--chat-bg); color: #fff; }
    .chat-msg-area { flex: 1; padding-bottom: 8px; }
    .msg-item { margin-bottom: 12px; }
    .msg-me { display: flex; justify-content: flex-end; }
    .msg-mj { display: flex; justify-content: flex-start; }
    .bubble {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: var(--bubble-radius);
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg-me .bubble { background: var(--me-bubble); }
    .msg-mj .bubble { background: var(--mj-bubble); }
    .msg-time { font-size: 10px; opacity: 0.6; margin-top: 3px; }
    .msg-me .msg-time { text-align: right; }
    .input-bar {
      display: flex; gap: 6px;
      padding: 10px 12px;
      border-top: 1px solid #282828;
      flex-shrink: 0;
    }
    #chat-input {
      flex: 1; border-radius: 999px; border: none;
      padding: 8px 14px; background: #282828; color: #fff; outline: none;
    }
    #send-btn {
      border-radius: 999px; border: none; padding: 0 14px;
      background: var(--main-color); color: #fff; cursor: pointer;
    }

    /* ===== 字卡 / 通用列表 ===== */
    .card-input {
      width: 100%; min-height: 80px;
      background: #282828; color: #fff; border: none;
      border-radius: 10px; padding: 10px; outline: none;
      resize: vertical; margin-bottom: 10px;
    }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .btn-row button { flex: 1; }
    .card-item {
      background: #282828; border-radius: 10px;
      padding: 10px; margin-bottom: 8px;
    }
    .card-text { font-size: 14px; margin-bottom: 6px; white-space: pre-wrap; }
    .card-ctrl { display: flex; gap: 6px; }
    .card-ctrl button { font-size: 12px; padding: 4px 8px; }

    .setting-item { margin-bottom: 14px; }
    label { display: block; margin-bottom: 4px; font-size: 13px; }
    input[type="color"], input[type="range"] { width: 100%; }
    button {
      padding: 6px 12px; border-radius: 8px; border: none;
      cursor: pointer; margin: 2px;
    }
    .placeholder { opacity: 0.6; text-align: center; padding-top: 40px; }
    .toast {
      position: fixed; bottom: 40px; left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px; border-radius: 8px; z-index: 9999;
      background: var(--toast-bg); color: var(--toast-text); font-size: 13px;
    }
  </style>
</head>
<body>
<div class="phone-shell">
  <div class="phone-screen">
    <div class="status-bar">
      <span id="time-text">00:00</span>
      <span>信号</span>
    </div>
    <div class="app-main">

      <!-- 桌面页 -->
      <div class="page active" id="page-desktop">
        <div class="desk-top">
          <div class="desk-card">
            <div class="label">今日情话</div>
            <div class="value" id="desk-love">你不用和任何人比较</div>
          </div>
          <div class="desk-card">
            <div class="label">已摸鱼</div>
            <div class="value">5 天</div>
          </div>
        </div>
        <div class="checkin-bar">
          <div class="checkin-ico">♥</div>
          <div class="checkin-text">和 TA 一起摸鱼 · 今天也要甜甜的</div>
          <button class="checkin-btn">打卡</button>
        </div>
        <div class="icon-grid" id="icon-grid"></div>
        <div class="desk-dots"><span class="on"></span><span></span></div>
      </div>

      <!-- 聊天页 -->
      <div class="page" id="page-chat">
        <div class="func-header">
          <button class="back-btn" data-back>‹</button>
          <div class="func-title">梦角MJ</div>
        </div>
        <div class="chat-msg-area func-body" id="chat-area"></div>
        <div class="input-bar">
          <input id="chat-input" placeholder="输入消息..." />
          <button id="send-btn">发送</button>
        </div>
      </div>

      <!-- 字卡库页 -->
      <div class="page" id="page-card">
        <div class="func-header">
          <button class="back-btn" data-back>‹</button>
          <div class="func-title">字卡库</div>
        </div>
        <div class="func-body">
          <textarea class="card-input" id="newCardInput" placeholder="录入新的字卡内容..."></textarea>
          <div class="btn-row">
            <button id="addCardBtn">添加入库</button>
          </div>
          <div id="cardListWrap"></div>
        </div>
      </div>

      <!-- 占卜页 -->
      <div class="page" id="page-tarot">
        <div class="func-header">
          <button class="back-btn" data-back>‹</button>
          <div class="func-title">占卜</div>
        </div>
        <div class="func-body placeholder">塔罗 / 雷诺曼模块开发中</div>
      </div>

      <!-- 审核页 -->
      <div class="page" id="page-audit">
        <div class="func-header">
          <button class="back-btn" data-back>‹</button>
          <div class="func-title">审核中心</div>
        </div>
        <div class="func-body placeholder">待审申请、历史档案、字卡库将放在这里</div>
      </div>

      <!-- 树洞页 -->
      <div class="page" id="page-treehole">
        <div class="func-header">
          <button class="back-btn" data-back>‹</button>
          <div class="func-title">随心藏树洞</div>
        </div>
        <div class="func-body placeholder">便签留言板开发中</div>
      </div>

      <!-- 小屋页 -->
      <div class="page" id="page-cabin">
        <div class="func-header">
          <button class="back-btn" data-back>‹</button>
          <div class="func-title">小屋纸条</div>
        </div>
        <div class="func-body placeholder">纸条互动开发中</div>
      </div>

      <!-- 心理咨询页 -->
      <div class="page" id="page-psy">
        <div class="func-header">
          <button class="back-btn" data-back>‹</button>
          <div class="func-title">心理咨询</div>
        </div>
        <div class="func-body placeholder">写信 / 便签 / 陪伴开发中</div>
      </div>

      <!-- 漂流瓶页 -->
      <div class="page" id="page-bottle">
        <div class="func-header">
          <button class="back-btn" data-back>‹</button>
          <div class="func-title">漂流瓶</div>
        </div>
        <div class="func-body placeholder">扔瓶子 / 捡瓶子开发中</div>
      </div>

      <!-- 设置页 -->
      <div class="page" id="page-setting">
        <div class="func-header">
          <button class="back-btn" data-back>‹</button>
          <div class="func-title">美化设置</div>
        </div>
        <div class="func-body">
          <div class="setting-item">
            <label>主色调</label>
            <input type="color" id="inp-main-color">
          </div>
          <div class="setting-item">
            <label>全局圆角</label>
            <input type="range" id="inp-global-radius" min="0" max="36" value="16">
          </div>
          <div class="setting-item">
            <label>气泡圆角</label>
            <input type="range" id="inp-bubble-radius" min="0" max="24" value="12">
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  // ========== 全局上下文 ==========
  window.GLOBAL_CONTEXT = {
    activeSessionId: "mj-001",
    currentApp: "desktop",
    config: { mainColor: "#8c78b9", globalRadius: 16, bubbleRadius: 12 }
  }

  // ========== 事件总线 ==========
  const EventBus = {
    events: {},
    on(name, fn) {
      if (!this.events[name]) this.events[name] = []
      this.events[name].push(fn)
    },
    emit(name, data) {
      if (!this.events[name]) return
      this.events[name].forEach(cb => cb(data))
    }
  }
  const EVENT = {
    SESSION_CHANGED: "session-changed",
    AUDIT_DATA_UPDATED: "my-audit-data-updated"
  }

  // ========== 本地存储 ==========
  const Store = {
    get(key, defaultValue) {
      try {
        const str = localStorage.getItem(key)
        return str ? JSON.parse(str) : defaultValue
      } catch (e) { return defaultValue }
    },
    set(key, val) { localStorage.setItem(key, JSON.stringify(val)) }
  }
  const CHAT_KEY = `xy-home-v2:${window.GLOBAL_CONTEXT.activeSessionId}:chat-msgs`
  const CARD_LIB_KEY = `xy-home-v2:card-lib`

  // ========== 桌面图标配置 ==========
  const APP_LIST = [
    { key: "chat",      icon: "💬", name: "聊天" },
    { key: "card",      icon: "📜", name: "字卡" },
    { key: "tarot",     icon: "🃏", name: "占卜" },
    { key: "audit",     icon: "✅", name: "审核", badge: 4 },
    { key: "treehole",  icon: "📝", name: "树洞" },
    { key: "cabin",     icon: "🏠", name: "小屋" },
    { key: "psy",       icon: "💌", name: "心语" },
    { key: "bottle",    icon: "🍾", name: "漂流瓶" },
    { key: "setting",   icon: "⚙️", name: "设置" }
  ]

  function renderDesktopIcons() {
    const grid = document.getElementById("icon-grid")
    grid.innerHTML = ""
    APP_LIST.forEach(app => {
      const div = document.createElement("div")
      div.className = "app-icon"
      div.dataset.app = app.key
      div.innerHTML = `
        <div class="icon-box">${app.icon}</div>
        <div class="icon-name">${app.name}</div>
        ${app.badge ? `<div class="badge">${app.badge}</div>` : ""}
      `
      div.onclick = () => openApp(app.key)
      grid.appendChild(div)
    })
  }

  // ========== 页面切换 ==========
  function openApp(key) {
    window.GLOBAL_CONTEXT.currentApp = key
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"))
    document.getElementById(`page-${key}`).classList.add("active")
    if (key === "card") renderCardList()
    if (key === "chat") renderChat()
  }
  function goHome() {
    window.GLOBAL_CONTEXT.currentApp = "desktop"
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"))
    document.getElementById("page-desktop").classList.add("active")
  }
  document.querySelectorAll("[data-back]").forEach(btn => {
    btn.onclick = goHome
  })

  // ========== 聊天渲染 ==========
  function escapeHTML(str) {
    return str.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[c])
  }
  function renderChat() {
    const list = Store.get(CHAT_KEY, [])
    const wrap = document.getElementById("chat-area")
    wrap.innerHTML = ""
    list.forEach(msg => {
      const div = document.createElement("div")
      div.className = `msg-item ${msg.side === "me" ? "msg-me" : "msg-mj"}`
      div.innerHTML = `
        <div class="bubble">${escapeHTML(msg.text)}</div>
        <div class="msg-time">${msg.timeStr}</div>
      `
      wrap.appendChild(div)
    })
    wrap.scrollTop = wrap.scrollHeight
  }
  window.sendAuditCard = function(text, side = "mj") {
    const list = Store.get(CHAT_KEY, [])
    const d = new Date()
    const h = String(d.getHours()).padStart(2, "0")
    const m = String(d.getMinutes()).padStart(2, "0")
    const s = String(d.getSeconds()).padStart(2, "0")
    list.push({ side, text, timeStr: `${h}:${m}:${s}`, ts: d.getTime(), injected: 1 })
    Store.set(CHAT_KEY, list)
    renderChat()
    EventBus.emit(EVENT.AUDIT_DATA_UPDATED, { text, side })
  }

  // ========== 字卡库 ==========
  function getCardList() { return Store.get(CARD_LIB_KEY, []) }
  function saveCardList(arr) { Store.set(CARD_LIB_KEY, arr) }
  function renderCardList() {
    const wrap = document.getElementById("cardListWrap")
    const cards = getCardList()
    wrap.innerHTML = ""
    if (cards.length === 0) {
      wrap.innerHTML = "<div class='placeholder'>暂无字卡</div>"
      return
    }
    cards.forEach((item, idx) => {
      const div = document.createElement("div")
      div.className = "card-item"
      div.innerHTML = `
        <div class="card-text">${escapeHTML(item.content)}</div>
        <div class="card-ctrl">
          <button class="send-card" data-idx="${idx}">发送到聊天</button>
          <button class="del-card" data-idx="${idx}">删除</button>
        </div>
      `
      wrap.appendChild(div)
    })
    document.querySelectorAll(".send-card").forEach(btn => {
      btn.onclick = () => {
        const c = getCardList()[Number(btn.dataset.idx)]
        window.sendAuditCard(c.content, "mj")
        toast("已发送，回到聊天页查看")
      }
    })
    document.querySelectorAll(".del-card").forEach(btn => {
      btn.onclick = () => {
        const arr = getCardList()
        arr.splice(Number(btn.dataset.idx), 1)
        saveCardList(arr)
        renderCardList()
        toast("已删除")
      }
    })
  }
  document.getElementById("addCardBtn").onclick = () => {
    const input = document.getElementById("newCardInput")
    const txt = input.value.trim()
    if (!txt) return toast("字卡内容不能为空")
    const arr = getCardList()
    arr.push({ content: txt, createTs: Date.now() })
    saveCardList(arr)
    input.value = ""
    renderCardList()
    toast("字卡入库成功")
  }

  // ========== 美化配置 ==========
  const savedConfig = Store.get("app-config", null)
  if (savedConfig) window.GLOBAL_CONTEXT.config = savedConfig
  function applyConfig() {
    const cfg = window.GLOBAL_CONTEXT.config
    document.documentElement.style.setProperty("--main-color", cfg.mainColor)
    document.documentElement.style.setProperty("--global-radius", cfg.globalRadius + "px")
    document.documentElement.style.setProperty("--bubble-radius", cfg.bubbleRadius + "px")
    Store.set("app-config", cfg)
  }
  applyConfig()
  const inpColor = document.getElementById("inp-main-color")
  const inpGR = document.getElementById("inp-global-radius")
  const inpBR = document.getElementById("inp-bubble-radius")
  inpColor.value = window.GLOBAL_CONTEXT.config.mainColor
  inpGR.value = window.GLOBAL_CONTEXT.config.globalRadius
  inpBR.value = window.GLOBAL_CONTEXT.config.bubbleRadius
  inpColor.oninput = () => { window.GLOBAL_CONTEXT.config.mainColor = inpColor.value; applyConfig() }
  inpGR.oninput = () => { window.GLOBAL_CONTEXT.config.globalRadius = Number(inpGR.value); applyConfig() }
  inpBR.oninput = () => { window.GLOBAL_CONTEXT.config.bubbleRadius = Number(inpBR.value); applyConfig() }

  // ========== Toast ==========
  function toast(text) {
    const el = document.createElement("div")
    el.className = "toast"
    el.innerText = text
    document.body.appendChild(el)
    setTimeout(() => el.remove(), 1600)
  }

  // ========== 聊天发送 ==========
  const input = document.getElementById("chat-input")
  const sendBtn = document.getElementById("send-btn")
  function sendMsg() {
    const txt = input.value.trim()
    if (!txt) return toast("内容不能为空")
    window.sendAuditCard(txt, "me")
    input.value = ""
  }
  sendBtn.onclick = sendMsg
  input.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); sendMsg() } }

  // ========== 状态栏时间 ==========
  function updateTime() {
    const d = new Date()
    const h = String(d.getHours()).padStart(2, "0")
    const m = String(d.getMinutes()).padStart(2, "0")
    document.getElementById("time-text").innerText = `${h}:${m}`
  }
  updateTime()
  setInterval(updateTime, 60000)

  // 初始化
  renderDesktopIcons()
  renderChat()
</script>
</body>
</html>
