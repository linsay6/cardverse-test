<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>梦角字卡传讯</title>
  <style>
    :root {
      --main-color: #8c78b9;
      --global-radius: 16px;
      --bubble-radius: 12px;
      --toast-bg: #333333;
      --toast-text: #ffffff;
      --chat-bg: #121212;
      --me-bubble: #504080;
      --mj-bubble: #2c2c2c;
      --panel-bg: #1b1b1b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: system-ui, sans-serif;
      color: #fff;
    }
    /* 手机模拟器外壳 */
    .phone-shell {
      width: 360px;
      height: 720px;
      border-radius: 42px;
      border: 10px solid #111;
      background: #000;
      overflow: hidden;
      position: relative;
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    /* 顶部状态栏 */
    .status-bar {
      height: 32px;
      background: rgba(0,0,0,0.25);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
      font-size: 12px;
    }
    /* 聊天主容器 */
    #app-container {
      height: calc(100% - 32px);
      display: flex;
      flex-direction: column;
      background: var(--chat-bg);
    }
    .chat-header{
      padding:10px 14px;
      text-align:center;
      border-bottom:1px solid #282828;
    }
    .chat-name{
      font-weight: 500;
    }
    .chat-msg-area{
      flex:1;
      padding:12px;
      overflow-y:auto;
    }
    .msg-item{
      margin-bottom:12px;
    }
    .msg-me{
      display:flex;
      justify-content:flex-end;
    }
    .msg-mj{
      display:flex;
      justify-content:flex-start;
    }
    .bubble{
      max-width:75%;
      padding: 8px 12px;
      border-radius: var(--bubble-radius);
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg-me .bubble{
      background: var(--me-bubble);
    }
    .msg-mj .bubble{
      background: var(--mj-bubble);
    }
    .msg-time{
      font-size:10px;
      opacity:0.6;
      margin-top: 3px;
    }
    .msg-me .msg-time{
      text-align:right;
    }
    .input-bar{
      display:flex;
      gap:6px;
      padding:10px;
      border-top:1px solid #282828;
    }
    #chat-input{
      flex:1;
      border-radius:999px;
      border:none;
      padding: 8px 14px;
      background:#282828;
      color:#fff;
      outline:none;
    }
    #send-btn{
      border-radius:999px;
      border:none;
      padding: 0 14px;
      background: var(--main-color);
      color:#fff;
      cursor:pointer;
    }
    /* 美化设置抽屉 */
    .setting-drawer {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      padding: 20px;
      overflow-y: auto;
      z-index: 10;
    }
    .setting-drawer.open {
      display: block;
    }
    .setting-item {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }
    input[type="color"], input[type="range"] {
      width: 100%;
    }
    /* 悬浮球 */
    .float-ball{
      width:44px;
      height:44px;
      border-radius:50%;
      background:var(--main-color);
      position:absolute;
      bottom:110px;
      right:14px;
      z-index:12;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
    }
    /* 字卡审核面板 */
    .audit-panel{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.75);
      z-index:11;
      display:none;
      padding:16px;
      overflow-y:auto;
    }
    .audit-panel.open{
      display:block;
    }
    .panel-wrap{
      background:var(--panel-bg);
      border-radius:var(--global-radius);
      padding:16px;
    }
    .panel-title{
      text-align:center;
      margin-bottom:12px;
      font-size:16px;
      font-weight:500;
    }
    .card-input{
      width:100%;
      min-height:80px;
      background:#282828;
      color:#fff;
      border:none;
      border-radius:10px;
      padding:10px;
      outline:none;
      resize:vertical;
      margin-bottom:10px;
    }
    .btn-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }
    .btn-row button{
      flex:1;
    }
    .card-item{
      background:#282828;
      border-radius:10px;
      padding:10px;
      margin-bottom:8px;
    }
    .card-text{
      font-size:14px;
      margin-bottom:6px;
      white-space:pre-wrap;
    }
    .card-ctrl{
      display:flex;
      gap:6px;
    }
    .card-ctrl button{
      font-size:12px;
      padding:4px 8px;
    }
    button {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      margin: 2px;
    }
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 8px;
      z-index: 9999;
      background: var(--toast-bg);
      color: var(--toast-text);
      font-size: 13px;
    }
  </style>
</head>
<body>
<div class="phone-shell">
  <div class="phone-screen">
    <div class="status-bar">
      <span id="time-text">00:00</span>
      <span>信号</span>
    </div>
    <div id="app-container">
      <div class="chat-header">
        <div class="chat-name">梦角MJ</div>
      </div>
      <div class="chat-msg-area" id="chat-area"></div>
      <div class="input-bar">
        <input id="chat-input" placeholder="输入消息..." />
        <button id="send-btn">发送</button>
      </div>
    </div>
    <!-- 悬浮球 -->
    <div class="float-ball" id="floatBtn">卡</div>
    <!-- 字卡审核面板 -->
    <div class="audit-panel" id="auditPanel">
      <div class="panel-wrap">
        <div class="panel-title">字卡审核库</div>
        <textarea class="card-input" id="newCardInput" placeholder="录入新的字卡内容..."></textarea>
        <div class="btn-row">
          <button id="addCardBtn">添加入库</button>
          <button id="closeAuditBtn">关闭面板</button>
        </div>
        <div id="cardListWrap"></div>
      </div>
    </div>
    <!-- 美化抽屉 -->
    <div class="setting-drawer" id="setting-drawer">
      <div class="setting-item">
        <label>主色调</label>
        <input type="color" id="inp-main-color">
      </div>
      <div class="setting-item">
        <label>全局圆角</label>
        <input type="range" id="inp-global-radius" min="0" max="36" value="16">
      </div>
      <div class="setting-item">
        <label>气泡圆角</label>
        <input type="range" id="inp-bubble-radius" min="0" max="24" value="12">
      </div>
      <button id="close-setting">关闭</button>
      <button id="open-setting-btn">回到聊天页</button>
    </div>
  </div>
</div>
<script>
  // ========== 全局上下文 ==========
  window.GLOBAL_CONTEXT = {
    activeSessionId: "mj-001",
    config: {
      mainColor: "#8c78b9",
      globalRadius: 16,
      bubbleRadius: 12
    }
  }
  // ========== 事件总线 ==========
  const EventBus = {
    events: {},
    on(name, fn) {
      if (!this.events[name]) this.events[name] = []
      this.events[name].push(fn)
    },
    emit(name, data) {
      if (!this.events[name]) return
      this.events[name].forEach(cb => cb(data))
    }
  }
  const EVENT = {
    SESSION_CHANGED: "session-changed",
    AUDIT_DATA_UPDATED: "my-audit-data-updated"
  }
  // ========== localStorage 存储工具 ==========
  const Store = {
    get(key, defaultValue) {
      try {
        const str = localStorage.getItem(key)
        return str ? JSON.parse(str) : defaultValue
      } catch (e) {
        return defaultValue
      }
    },
    set(key, val) {
      localStorage.setItem(key, JSON.stringify(val))
    },
    exportAll() {
      const out = {}
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i)
        out[k] = this.get(k, null)
      }
      return out
    },
    importAll(json) {
      Object.entries(json).forEach(([k, v]) => this.set(k, v))
    }
  }
  // 存储Key
  const CHAT_KEY = `xy-home-v2:${window.GLOBAL_CONTEXT.activeSessionId}:chat-msgs`
  const CARD_LIB_KEY = `xy-home-v2:card-lib`

  // ========== 聊天渲染函数 ==========
  function renderChat(){
    const list = Store.get(CHAT_KEY, [])
    const wrap = document.getElementById("chat-area")
    wrap.innerHTML = ""
    list.forEach(msg=>{
      const div = document.createElement("div")
      div.className = `msg-item ${ msg.side === "me" ? "msg-me" : "msg-mj"}`
      div.innerHTML = `
        <div class="bubble">${escapeHTML(msg.text)}</div>
        <div class="msg-time">${msg.timeStr}</div>
      `
      wrap.appendChild(div)
    })
    wrap.scrollTop = wrap.scrollHeight
  }
  function escapeHTML(str){
    return str.replace(/[&<>"']/g, c=> ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    })[c])
  }
  // 全局注入气泡接口
  window.sendAuditCard = function(text, side="mj"){
    const list = Store.get(CHAT_KEY, [])
    const d = new Date()
    const h = String(d.getHours()).padStart(2,"0")
    const m = String(d.getMinutes()).padStart(2,"0")
    const s = String(d.getSeconds()).padStart(2,"0")
    const timeStr = `${h}:${m}:${s}`
    list.push({
      side,
      text,
      timeStr,
      ts: d.getTime(),
      injected: 1
    })
    Store.set(CHAT_KEY, list)
    renderChat()
    EventBus.emit(EVENT.AUDIT_DATA_UPDATED, {text, side})
  }

  // ========== 字卡库模块 ==========
  function getCardList(){
    return Store.get(CARD_LIB_KEY, [])
  }
  function saveCardList(arr){
    Store.set(CARD_LIB_KEY, arr)
  }
  function renderCardList(){
    const wrap = document.getElementById("cardListWrap")
    const cards = getCardList()
    wrap.innerHTML = ""
    if(cards.length === 0){
      wrap.innerHTML = "<div style='opacity:0.6;text-align:center'>暂无字卡</div>"
      return
    }
    cards.forEach((item,idx)=>{
      const div = document.createElement("div")
      div.className = "card-item"
      div.innerHTML = `
        <div class="card-text">${escapeHTML(item.content)}</div>
        <div class="card-ctrl">
          <button class="send-card" data-idx="${idx}">发送到聊天</button>
          <button class="del-card" data-idx="${idx}">删除</button>
        </div>
      `
      wrap.appendChild(div)
    })
    // 发送字卡
    document.querySelectorAll(".send-card").forEach(btn=>{
      btn.onclick = ()=>{
        const i = Number(btn.dataset.idx)
        const c = getCardList()[i]
        window.sendAuditCard(c.content, "mj")
        toast("已发送字卡")
      }
    })
    // 删除字卡
    document.querySelectorAll(".del-card").forEach(btn=>{
      btn.onclick = ()=>{
        const i = Number(btn.dataset.idx)
        const arr = getCardList()
        arr.splice(i,1)
        saveCardList(arr)
        renderCardList()
        toast("已删除")
      }
    })
  }
  // 添加新字卡
  document.getElementById("addCardBtn").onclick = ()=>{
    const input = document.getElementById("newCardInput")
    const txt = input.value.trim()
    if(!txt) return toast("字卡内容不能为空")
    const arr = getCardList()
    arr.push({content:txt, createTs:Date.now()})
    saveCardList(arr)
    input.value = ""
    renderCardList()
    toast("字卡入库成功")
  }

  // ========== 美化配置 ==========
  const savedConfig = Store.get("app-config", null)
  if (savedConfig) {
    window.GLOBAL_CONTEXT.config = savedConfig
  }
  function applyConfig() {
    const cfg = window.GLOBAL_CONTEXT.config
    document.documentElement.style.setProperty("--main-color", cfg.mainColor)
    document.documentElement.style.setProperty("--global-radius", cfg.globalRadius + "px")
    document.documentElement.style.setProperty("--bubble-radius", cfg.bubbleRadius + "px")
    Store.set("app-config", cfg)
  }
  applyConfig()
  // ========== Toast ==========
  function toast(text) {
    const el = document.createElement("div")
    el.className = "toast"
    el.innerText = text
    document.body.appendChild(el)
    setTimeout(() => el.remove(), 1600)
  }
  // ========== 美化面板绑定 ==========
  const drawer = document.getElementById("setting-drawer")
  const openBtn = document.getElementById("open-setting-btn")
  const closeBtn = document.getElementById("close-setting")
  const inpColor = document.getElementById("inp-main-color")
  const inpGR = document.getElementById("inp-global-radius")
  const inpBR = document.getElementById("inp-bubble-radius")
  inpColor.value = window.GLOBAL_CONTEXT.config.mainColor
  inpGR.value = window.GLOBAL_CONTEXT.config.globalRadius
  inpBR.value = window.GLOBAL_CONTEXT.config.bubbleRadius

  openBtn.onclick = () => drawer.classList.add("open")
  closeBtn.onclick = () => drawer.classList.remove("open")

  inpColor.oninput = () => {
    window.GLOBAL_CONTEXT.config.mainColor = inpColor.value
    applyConfig()
  }
  inpGR.oninput = () => {
    window.GLOBAL_CONTEXT.config.globalRadius = Number(inpGR.value)
    applyConfig()
  }
  inpBR.oninput = () => {
    window.GLOBAL_CONTEXT.config.bubbleRadius = Number(inpBR.value)
    applyConfig()
  }
  // ========== 悬浮球 & 审核面板 ==========
  const floatBtn = document.getElementById("floatBtn")
  const auditPanel = document.getElementById("auditPanel")
  const closeAuditBtn = document.getElementById("closeAuditBtn")
  floatBtn.onclick = ()=>{
    auditPanel.classList.add("open")
    renderCardList()
  }
  closeAuditBtn.onclick = ()=>{
    auditPanel.classList.remove("open")
  }
  // ========== 发送消息逻辑 ==========
  const input = document.getElementById("chat-input")
  const sendBtn = document.getElementById("send-btn")
  function sendMsg(){
    const txt = input.value.trim()
    if(!txt) return toast("内容不能为空")
    window.sendAuditCard(txt, "me")
    input.value = ""
  }
  sendBtn.onclick = sendMsg
  input.onkeydown = e=>{
    if(e.key === "Enter"){
      e.preventDefault()
      sendMsg()
    }
  }
  // ========== 状态栏时间 ==========
  function updateTime() {
    const d = new Date()
    const h = String(d.getHours()).padStart(2, "0")
    const m = String(d.getMinutes()).padStart(2, "0")
    document.getElementById("time-text").innerText = `${h}:${m}`
  }
  updateTime()
  setInterval(updateTime, 60000)
  // 页面加载渲染
  renderChat()
</script>
</body>
</html>
