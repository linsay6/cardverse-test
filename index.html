<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>心信笺</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --color-main: #7c68ee;
    --color-bg: #ffffff;
    --color-text: #222222;
    --color-text-2: #666666;
    --color-border: #e5e7eb;
    --radius-global: 18px;
    --radius-card: 14px;
    --radius-btn: 10px;
    --tab-inactive: #999999;
    --tab-active: var(--color-main);
  }

  html, body {
    height: 100%;
  }

  body {
    background-color: #f5f5f7;
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 24px;
  }

  .phone-shell {
    width: 375px;
    height: 700px;
    background: #ffffff;
    border-radius: 40px;
    border: none;
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.04),
      0 8px 24px rgba(0, 0, 0, 0.08),
      0 20px 60px rgba(0, 0, 0, 0.12);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .view-area {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .tab-panel {
    width: 100%;
    height: 100%;
    display: none;
    overflow: auto;
    /* 重点新增这两行，让桌面、字卡、聊天、设置全部读取主题背景色 */
    background-color: var(--color-bg);
    color: var(--color-text);
  }

  .tab-footer {
    display: flex;
    border-top: 1px solid var(--color-border);
  }

  .tab-btn {
    flex: 1;
    padding: 12px 0;
    border: none;
    font-size: 14px;
    background: var(--color-bg);
    color: var(--color-text);
  }
</style>
</head>

<body>
  <div class="phone-shell">
    <div class="view-area">
      <div id="tab-desktop" class="tab-panel"></div>
      <div id="tab-card" class="tab-panel"></div>
      <div id="tab-chat" class="tab-panel"></div>
      <div id="tab-setting" class="tab-panel"></div>
    </div>

    <div class="tab-footer">
      <button class="tab-btn" data-tab="desktop">桌面</button>
      <button class="tab-btn" data-tab="card">字卡</button>
      <button class="tab-btn" data-tab="chat">聊天</button>
      <button class="tab-btn" data-tab="setting">设置</button>
    </div>
  </div>

<!-- 全局普通脚本，输出window.PRESET_RAW_CARD_DATA，必须放在模块脚本前面执行 -->
<script src="./js/preset-card-data.js"></script>
<!-- audit.js含有import/export，标记type="module" -->
<script type="module" src="./js/audit.js"></script>
<!-- app.js保留原有module不变 -->
<script type="module" src="./js/app.js"></script>
</body>
</html>
