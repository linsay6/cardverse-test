<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>梦角MJ</title>
  <style>
    :root {
      --main-color: #8c78b9;
      --global-radius: 16px;
      --bubble-radius: 12px;
      --toast-bg: #333333;
      --toast-text: #ffffff;
      --chat-bg: #121212;
      --me-bubble: #504080;
      --mj-bubble: #2c2c2c;
      --panel-bg: #1b1b1b;
      --tab-bg:#181818;
      --tab-active:#8c78b9;
      --tab-inactive:#888888;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: system-ui, sans-serif;
      color: #fff;
    }
    .phone-shell {
      width: 360px;
      height: 720px;
      border-radius: 42px;
      border: 10px solid #111;
      background: #000;
      overflow: hidden;
      position: relative;
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      display:flex;
      flex-direction:column;
    }
    .status-bar {
      height: 32px;
      background: rgba(0,0,0,0.25);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
      font-size: 12px;
      flex-shrink:0;
    }
    .app-main{
      flex:1;
      display:flex;
      flex-direction:column;
      background:var(--chat-bg);
      overflow:hidden;
    }
    /* 内容区域：所有Tab页面在这里切换 */
    .page-container{
      flex:1;
      position:relative;
      overflow:hidden;
    }
    .page{
      position:absolute;
      inset:0;
      overflow-y:auto;
      display:none;
      padding:12px;
    }
    .page.active{
      display:block;
    }
    /* 聊天页 */
    .chat-header{
      padding:10px 0;
      text-align:center;
      border-bottom:1px solid #282828;
      margin:-12px -12px 12px -12px;
    }
    .chat-name{
      font-weight: 500;
    }
    .chat-msg-area{
      flex:1;
      padding-bottom:8px;
    }
    .msg-item{
      margin-bottom:12px;
    }
    .msg-me{
      display:flex;
      justify-content:flex-end;
    }
    .msg-mj{
      display:flex;
      justify-content:flex-start;
    }
    .bubble{
      max-width:75%;
      padding: 8px 12px;
      border-radius: var(--bubble-radius);
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg-me .bubble{
      background: var(--me-bubble);
    }
    .msg-mj .bubble{
      background: var(--mj-bubble);
    }
    .msg-time{
      font-size:10px;
      opacity:0.6;
      margin-top: 3px;
    }
    .msg-me .msg-time{
      text-align:right;
    }
    .input-bar{
      display:flex;
      gap:6px;
      padding:10px 12px;
      border-top:1px solid #282828;
      margin:0 -12px -12px -12px;
    }
    #chat-input{
      flex:1;
      border-radius:999px;
      border:none;
      padding: 8px 14px;
      background:#282828;
      color:#fff;
      outline:none;
    }
    #send-btn{
      border-radius:999px;
      border:none;
      padding: 0 14px;
      background: var(--main-color);
      color:#fff;
      cursor:pointer;
    }
    /* 字卡库页面 */
    .card-input{
      width:100%;
      min-height:80px;
      background:#282828;
      color:#fff;
      border:none;
      border-radius:10px;
      padding:10px;
      outline:none;
      resize:vertical;
      margin-bottom:10px;
    }
    .btn-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:16px;
    }
    .btn-row button{
      flex:1;
    }
    .card-item{
      background:#282828;
      border-radius:10px;
      padding:10px;
      margin-bottom:8px;
    }
    .card-text{
      font-size:14px;
      margin-bottom:6px;
      white-space:pre-wrap;
    }
    .card-ctrl{
      display:flex;
      gap:6px;
    }
    .card-ctrl button{
      font-size:12px;
      padding:4px 8px;
    }
    /* 设置页 */
    .setting-item {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }
    input[type="color"], input[type="range"] {
      width: 100%;
    }
    /* 底部Tab导航栏 */
    .tab-bar{
      display:flex;
      background:var(--tab-bg);
      border-top:1px solid #282828;
      flex-shrink:0;
    }
    .tab-item{
      flex:1;
      text-align:center;
      padding:8px 4px;
      color:var(--tab-inactive);
      font-size:12px;
      cursor:pointer;
    }
    .tab-item.active{
      color:var(--tab-active);
    }
    .tab-icon{
      font-size:18px;
      display:block;
      margin-bottom:2px;
    }
    button {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      margin: 2px;
    }
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 8px;
      z-index: 9999;
      background: var(--toast-bg);
      color: var(--toast-text);
      font-size: 13px;
    }
  </style>
</head>
<body>
<div class="phone-shell">
  <div class="phone-screen">
    <div class="status-bar">
      <span id="time-text">00:00</span>
      <span>信号</span>
    </div>
    <div class="app-main">
      <div class="page-container">
        <!-- Tab1 聊天页 -->
        <div class="page active" id="page-chat">
          <div class="chat-header">
            <div class="chat-name">梦角MJ</div>
          </div>
          <div class="chat-msg-area" id="chat-area"></div>
          <div class="input-bar">
            <input id="chat-input" placeholder="输入消息..." />
            <button id="send-btn">发送</button>
          </div>
        </div>
        <!-- Tab2 字卡库页 -->
        <div class="page" id="page-card">
          <h3 style="text-align:center;margin-bottom:12px">字卡库</h3>
          <textarea class="card-input" id="newCardInput" placeholder="录入新的字卡内容..."></textarea>
          <div class="btn-row">
            <button id="addCardBtn">添加入库</button>
          </div>
          <div id="cardListWrap"></div>
        </div>
        <!-- Tab3 塔罗页（预留空面板，后面写逻辑） -->
        <div class="page" id="page-tarot">
          <h3 style="text-align:center;margin-bottom:12px">塔罗</h3>
          <div style="opacity:0.6;text-align:center;padding-top:40px">塔罗模块开发中</div>
        </div>
        <!-- Tab4 设置页 -->
        <div class="page" id="page-setting">
          <h3 style="text-align:center;margin-bottom:12px">美化设置</h3>
          <div class="setting-item">
            <label>主色调</label>
            <input type="color" id="inp-main-color">
          </div>
          <div class="setting-item">
            <label>全局圆角</label>
            <input type="range" id="inp-global-radius" min="0" max="36" value="16">
          </div>
          <div class="setting-item">
            <label>气泡圆角</label>
            <input type="range" id="inp-bubble-radius" min="0" max="24" value="12">
          </div>
        </div>
      </div>
      <!-- 底部Tab导航 -->
      <div class="tab-bar">
        <div class="tab-item active" data-page="chat">
          <span class="tab-icon">💬</span>聊天
        </div>
        <div class="tab-item" data-page="card">
          <span class="tab-icon">📜</span>字卡
        </div>
        <div class="tab-item" data-page="tarot">
          <span class="tab-icon">🃏</span>塔罗
        </div>
        <div class="tab-item" data-page="setting">
          <span class="tab-icon">⚙️</span>设置
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  // ========== 全局上下文 ==========
  window.GLOBAL_CONTEXT = {
    activeSessionId: "mj-001",
    currentPage:"chat",
    config: {
      mainColor: "#8c78b9",
      globalRadius: 16,
      bubbleRadius: 12
    }
  }
  // ========== 事件总线 ==========
  const EventBus = {
    events: {},
    on(name, fn) {
      if (!this.events[name]) this.events[name] = []
      this.events[name].push(fn)
    },
    emit(name, data) {
      if (!this.events[name]) return
      this.events[name].forEach(cb => cb(data))
    }
  }
  const EVENT = {
    SESSION_CHANGED: "session-changed",
    AUDIT_DATA_UPDATED: "my-audit-data-updated"
  }
  // ========== localStorage 存储工具 ==========
  const Store = {
    get(key, defaultValue) {
      try {
        const str = localStorage.getItem(key)
        return str ? JSON.parse(str) : defaultValue
      } catch (e) {
        return defaultValue
      }
    },
    set(key, val) {
      localStorage.setItem(key, JSON.stringify(val))
    }
  }
  const CHAT_KEY = `xy-home-v2:${window.GLOBAL_CONTEXT.activeSessionId}:chat-msgs`
  const CARD_LIB_KEY = `xy-home-v2:card-lib`

  // ========== Tab页面切换逻辑 ==========
  function switchPage(pageName){
    window.GLOBAL_CONTEXT.currentPage = pageName
    // 切换页面面板
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"))
    document.getElementById(`page-${pageName}`).classList.add("active")
    // 切换tab高亮
    document.querySelectorAll(".tab-item").forEach(t=>t.classList.remove("active"))
    document.querySelector(`.tab-item[data-page="${pageName}"]`).classList.add("active")
    // 切到字卡页自动刷新列表
    if(pageName === "card") renderCardList()
  }
  document.querySelectorAll(".tab-item").forEach(tab=>{
    tab.onclick = ()=> switchPage(tab.dataset.page)
  })

  // ========== 聊天渲染 ==========
  function renderChat(){
    const list = Store.get(CHAT_KEY, [])
    const wrap = document.getElementById("chat-area")
    wrap.innerHTML = ""
    list.forEach(msg=>{
      const div = document.createElement("div")
      div.className = `msg-item ${ msg.side === "me" ? "msg-me" : "msg-mj"}`
      div.innerHTML = `
        <div class="bubble">${escapeHTML(msg.text)}</div>
        <div class="msg-time">${msg.timeStr}</div>
      `
      wrap.appendChild(div)
    })
    wrap.scrollTop = wrap.scrollHeight
  }
  function escapeHTML(str){
    return str.replace(/[&<>"']/g, c=> ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    })[c])
  }
  window.sendAuditCard = function(text, side="mj"){
    const list = Store.get(CHAT_KEY, [])
    const d = new Date()
    const h = String(d.getHours()).padStart(2,"0")
    const m = String(d.getMinutes()).padStart(2,"0")
    const s = String(d.getSeconds()).padStart(2,"0")
    const timeStr = `${h}:${m}:${s}`
    list.push({
      side,
      text,
      timeStr,
      ts: d.getTime(),
      injected: 1
    })
    Store.set(CHAT_KEY, list)
    renderChat()
    EventBus.emit(EVENT.AUDIT_DATA_UPDATED, {text, side})
  }

  // ========== 字卡库模块 ==========
  function getCardList(){
    return Store.get(CARD_LIB_KEY, [])
  }
  function saveCardList(arr){
    Store.set(CARD_LIB_KEY, arr)
  }
  function renderCardList(){
    const wrap = document.getElementById("cardListWrap")
    const cards = getCardList()
    wrap.innerHTML = ""
    if(cards.length === 0){
      wrap.innerHTML = "<div style='opacity:0.6;text-align:center'>暂无字卡</div>"
      return
    }
    cards.forEach((item,idx)=>{
      const div = document.createElement("div")
      div.className = "card-item"
      div.innerHTML = `
        <div class="card-text">${escapeHTML(item.content)}</div>
        <div class="card-ctrl">
          <button class="send-card" data-idx="${idx}">发送到聊天</button>
          <button class="del-card" data-idx="${idx}">删除</button>
        </div>
      `
      wrap.appendChild(div)
    })
    document.querySelectorAll(".send-card").forEach(btn=>{
      btn.onclick = ()=>{
        const i = Number(btn.dataset.idx)
        const c = getCardList()[i]
        window.sendAuditCard(c.content, "mj")
        toast("已发送，切换到聊天页查看")
      }
    })
    document.querySelectorAll(".del-card").forEach(btn=>{
      btn.onclick = ()=>{
        const i = Number(btn.dataset.idx)
        const arr = getCardList()
        arr.splice(i,1)
        saveCardList(arr)
        renderCardList()
        toast("已删除")
      }
    })
  }
  document.getElementById("addCardBtn").onclick = ()=>{
    const input = document.getElementById("newCardInput")
    const txt = input.value.trim()
    if(!txt) return toast("字卡内容不能为空")
    const arr = getCardList()
    arr.push({content:txt, createTs:Date.now()})
    saveCardList(arr)
    input.value = ""
    renderCardList()
    toast("字卡入库成功")
  }

  // ========== 美化配置 ==========
  const savedConfig = Store.get("app-config", null)
  if (savedConfig) {
    window.GLOBAL_CONTEXT.config = savedConfig
  }
  function applyConfig() {
    const cfg = window.GLOBAL_CONTEXT.config
    document.documentElement.style.setProperty("--main-color", cfg.mainColor)
    document.documentElement.style.setProperty("--global-radius", cfg.globalRadius + "px")
    document.documentElement.style.setProperty("--bubble-radius", cfg.bubbleRadius + "px")
    Store.set("app-config", cfg)
  }
  applyConfig()
  const inpColor = document.getElementById("inp-main-color")
  const inpGR = document.getElementById("inp-global-radius")
  const inpBR = document.getElementById("inp-bubble-radius")
  inpColor.value = window.GLOBAL_CONTEXT.config.mainColor
  inpGR.value = window.GLOBAL_CONTEXT.config.globalRadius
  inpBR.value = window.GLOBAL_CONTEXT.config.bubbleRadius
  inpColor.oninput = () => {
    window.GLOBAL_CONTEXT.config.mainColor = inpColor.value
    applyConfig()
  }
  inpGR.oninput = () => {
    window.GLOBAL_CONTEXT.config.globalRadius = Number(inpGR.value)
    applyConfig()
  }
  inpBR.oninput = () => {
    window.GLOBAL_CONTEXT.config.bubbleRadius = Number(inpBR.value)
    applyConfig()
  }

  // ========== Toast ==========
  function toast(text) {
    const el = document.createElement("div")
    el.className = "toast"
    el.innerText = text
    document.body.appendChild(el)
    setTimeout(() => el.remove(), 1600)
  }

  // ========== 聊天发送 ==========
  const input = document.getElementById("chat-input")
  const sendBtn = document.getElementById("send-btn")
  function sendMsg(){
    const txt = input.value.trim()
    if(!txt) return toast("内容不能为空")
    window.sendAuditCard(txt, "me")
    input.value = ""
  }
  sendBtn.onclick = sendMsg
  input.onkeydown = e=>{
    if(e.key === "Enter"){
      e.preventDefault()
      sendMsg()
    }
  }

  // ========== 状态栏时间 ==========
  function updateTime() {
    const d = new Date()
    const h = String(d.getHours()).padStart(2, "0")
    const m = String(d.getMinutes()).padStart(2, "0")
    document.getElementById("time-text").innerText = `${h}:${m}`
  }
  updateTime()
  setInterval(updateTime, 60000)

  // 初始化渲染
  renderChat()
</script>
</body>
</html>
