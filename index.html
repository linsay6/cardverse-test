<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>梦角传讯</title>
<style>
:root {
  --color-main: #7c68ee;
  --color-bg: #ffffff;
  --color-text: #222222;
  --color-text-2: #666666;
  --color-border: #e5e7eb;
  --radius-global: 18px;
  --radius-card: 14px;
  --radius-btn: 10px;
  --phone-shadow: 0 10px 30px rgba(0,0,0,0.25);
  --tab-active: var(--color-main);
  --tab-inactive: #999;
}
* {
  margin:0;
  padding:0;
  box-sizing: border-box;
  font-family: system-ui, -apple-system, sans-serif;
}
body {
  min-height: 100vh;
  background: #eee;
  display: flex;
  align-items: center;
  justify-content: center;
  padding:16px;
}
/* 手机外壳 */
.phone-wrap {
  width: 375px;
  height: 700px;
  background: #111;
  border-radius: 42px;
  padding:12px;
  box-shadow: var(--phone-shadow);
  overflow: hidden;
  position: relative;
}
.phone-screen {
  width:100%;
  height:100%;
  background: var(--color-bg);
  border-radius: 32px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
/* 顶部状态栏 */
.status-bar {
  height:32px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content: space-between;
  font-size:13px;
  color: var(--color-text);
  background: var(--color-bg);
  flex-shrink:0;
}
/* 主内容区域 */
.main-container {
  flex:1;
  position: relative;
  overflow:hidden;
}
.tab-page {
  width:100%;
  height:100%;
  position:absolute;
  top:0;
  left:0;
  padding:12px;
  overflow-y:auto;
  display:none;
  background: var(--color-bg);
}
.tab-page.active {
  display:block;
}
/* 底部Tab栏 */
.tab-bar {
  height:54px;
  display:flex;
  background: var(--color-bg);
  border-top:1px solid var(--color-border);
  flex-shrink:0;
}
.tab-item {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color: var(--tab-inactive);
  font-size:12px;
  gap:3px;
  cursor:pointer;
}
.tab-item.active {
  color: var(--tab-active);
}
.tab-icon {
  font-size:18px;
}
</style>
</head>
<body>
<div class="phone-wrap">
  <div class="phone-screen">
    <!-- 顶部状态栏 -->
    <div class="status-bar">
      <span id="status-time">00:00</span>
      <span>📶 🔋</span>
    </div>
    <!-- 页面容器：桌面、字卡、设置 -->
    <div class="main-container">
      <div id="page-desktop" class="tab-page active">
        <!-- 桌面九宫格挂载点 -->
        <div id="desktop-root"></div>
      </div>
      <div id="page-cardlib" class="tab-page">
        <!-- 字卡库挂载点 -->
        <div id="cardlib-root"></div>
      </div>
      <div id="page-setting" class="tab-page">
        <!-- 设置面板挂载点 -->
        <div id="setting-root"></div>
      </div>
    </div>
    <!-- 底部Tab -->
    <div class="tab-bar">
      <div class="tab-item active" data-tab="desktop">
        <div class="tab-icon">🏠</div>
        <span>桌面</span>
      </div>
      <div class="tab-item" data-tab="cardlib">
        <div class="tab-icon">📇</div>
        <span>字卡</span>
      </div>
      <div class="tab-item" data-tab="setting">
        <div class="tab-icon">⚙️</div>
        <span>设置</span>
      </div>
    </div>
  </div>
</div>

<script type="module" src="./js/app.js"></script>
<script>
// Tab切换基础原生逻辑（只做显隐切换，简单写在这里，不进业务模块）
const tabItems = document.querySelectorAll('.tab-item');
const pages = document.querySelectorAll('.tab-page');
tabItems.forEach(tab=>{
  tab.onclick = ()=>{
    const targetKey = tab.dataset.tab;
    // 清除激活
    tabItems.forEach(t=>t.classList.remove('active'));
    pages.forEach(p=>p.classList.remove('active'));
    // 激活
    tab.classList.add('active');
    document.getElementById(`page-${targetKey}`).classList.add('active');
  }
})
// 状态栏时间刷新
function updateTime(){
  const d = new Date();
  let h = String(d.getHours()).padStart(2,'0');
  let m = String(d.getMinutes()).padStart(2,'0');
  document.getElementById('status-time').innerText = `${h}:${m}`;
}
updateTime();
setInterval(updateTime, 1000);
</script>
</body>
</html>
